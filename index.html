<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7e9e7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="わたしの家計簿"><link rel="manifest" href="manifest.json"><title>わたしの家計簿</title>
<style>
:root{--bg:#fbf7f5;--card:#fff;--text:#4b4543;--muted:#8b817d;--line:#eee4e0;--a:#c98f8b;--a2:#e9c7c2;--g:#8fae91;--danger:#b96c67}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:90px}.top{padding:22px 20px 10px}.title{font-size:22px;font-weight:700}.period{font-size:12px;color:var(--muted);margin-top:4px}main{padding:10px 16px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:12px;box-shadow:0 4px 16px #8b817d0b}.hero{background:linear-gradient(135deg,#f4dfdc,#fff)}.label{font-size:12px;color:var(--muted)}.big{font-size:31px;font-weight:800;margin:4px 0 10px}.amount{font-size:21px;font-weight:750;margin-top:4px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.mini{font-size:13px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cat{padding:10px 0;border-bottom:1px solid var(--line)}.cat:last-child{border-bottom:0}.pill{font-size:11px;padding:4px 8px;border-radius:99px;background:#f5ece9;color:#7b6863}.progress{height:9px;background:#f0e9e6;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--a);border-radius:99px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:76px;background:#fffffff2;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:5;padding-bottom:env(safe-area-inset-bottom)}nav button{border:0;background:none;color:var(--muted);font-size:10px}nav button.active{color:var(--a);font-weight:700}.ico{display:block;font-size:20px;margin-bottom:3px}button.primary{background:var(--a);color:#fff;border:0;border-radius:14px;padding:13px 16px;font-weight:700;width:100%}button.secondary{background:#f4ece9;border:0;border-radius:12px;padding:10px 12px;color:#665b58}button.danger{background:#f8e9e7;color:var(--danger);border:0;border-radius:12px;padding:9px 12px}input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px;margin:6px 0 12px;color:var(--text)}h2{font-size:18px;margin:6px 0 14px}.hidden{display:none}.fab{position:fixed;right:max(20px,calc((100vw - 520px)/2 + 20px));bottom:92px;width:56px;height:56px;border:0;border-radius:50%;background:var(--a);color:#fff;font-size:28px;box-shadow:0 8px 24px #8b817d33;z-index:6}.notice{padding:12px;border-radius:14px;background:#f8efed;font-size:12px;line-height:1.6}.chart{height:175px;display:flex;align-items:flex-end;gap:5px;padding:12px 4px 2px;border-bottom:1px solid var(--line)}.barwrap{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.bar{width:70%;max-width:24px;border-radius:7px 7px 2px 2px;background:var(--a2);min-height:2px}.bar.save{background:var(--g)}.barlabel{font-size:9px;color:var(--muted);margin-top:5px}.value{font-size:8px;color:var(--muted);margin-bottom:3px;writing-mode:vertical-rl}.modal{position:fixed;inset:0;background:#0005;z-index:20;display:flex;align-items:flex-end}.sheet{background:#fff;width:100%;max-width:520px;margin:auto;border-radius:22px 22px 0 0;padding:20px;max-height:90vh;overflow:auto}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#4b4543;color:#fff;padding:10px 15px;border-radius:99px;z-index:30;font-size:12px}
</style></head><body><div class="app"><header class="top"><div class="title">わたしの家計簿</div><div class="period" id="period"></div></header>
<main id="home"></main><main id="budget" class="hidden"></main><main id="saving" class="hidden"></main><main id="annual" class="hidden"></main><main id="history" class="hidden"></main><main id="settings" class="hidden"></main>
<button class="fab" onclick="openExpense()">＋</button><nav>
<button onclick="tab('home',this)" class="active"><span class="ico">🏠</span>ホーム</button><button onclick="tab('budget',this)"><span class="ico">💰</span>予算</button><button onclick="tab('saving',this)"><span class="ico">🏦</span>積立</button><button onclick="tab('annual',this)"><span class="ico">📊</span>年間</button><button onclick="tab('settings',this)"><span class="ico">⚙️</span>設定</button></nav></div>
<div id="modal"></div><div id="toast"></div>
<script>
const KEY="myBudgetAppV3";
const fresh={version:3,startDay:10,baseIncome:190000,bank:200000,categories:[["食費",20000],["交通費",8000],["交際費",20000],["美容",0],["コスメ",5000],["服・靴",10000],["日用品",5000],["医療",5000],["趣味",5000],["旅行",0],["その他",7000]],savings:[["美容積立",7700,0],["旅行積立",10000,0],["プレゼント積立",3000,0]],incomes:[],expenses:[],cycles:{}};
let d=JSON.parse(localStorage.getItem(KEY)||"null")||fresh; migrate(); ensureCurrentCycle(); save(); let viewKey=current().key;
function migrate(){d.version=3;d.cycles=d.cycles||{};d.incomes=d.incomes||[];d.expenses=d.expenses||[];d.savings=d.savings||[];d.categories=d.categories||[];d.budgetOverrides=d.budgetOverrides||{};d.savingOverrides=d.savingOverrides||{};let first=Object.keys(d.cycles).sort()[0]||current().key;d.savings.forEach(x=>{if(!x[3])x[3]=first})}
function save(){localStorage.setItem(KEY,JSON.stringify(d))}
function yen(n){return"¥"+Math.round(n).toLocaleString("ja-JP")}
function dateISO(x){return new Date(x.getFullYear(),x.getMonth(),x.getDate()).toISOString().slice(0,10)}
function cycleForDate(date){let y=date.getFullYear(),m=date.getMonth(),day=date.getDate();if(day<d.startDay)m--;let start=new Date(y,m,d.startDay),end=new Date(y,m+1,d.startDay);return{start,end,key:`${start.getFullYear()}-${String(start.getMonth()+1).padStart(2,"0")}`,label:`${start.getMonth()+1}月${d.startDay}日〜${end.getMonth()+1}月${d.startDay-1}日`}}
function keyForDate(s){return cycleForDate(new Date(s+"T12:00:00")).key}
function current(){return cycleForDate(new Date())}
function viewCycle(){let [y,m]=viewKey.split("-").map(Number);return cycleForDate(new Date(y,m-1,d.startDay))}
function expenses(key=viewKey){return d.expenses.filter(e=>keyForDate(e.date)===key)}
function incomes(key=viewKey){return d.incomes.filter(e=>keyForDate(e.date)===key)}
function ensureCurrentCycle(){let c=current();if(!d.cycles[c.key]){d.cycles[c.key]={createdAt:new Date().toISOString(),carried:{},closed:false};if(d.cycles[previousKey(c.key)]) d.cycles[c.key].carried=calculateCarry(previousKey(c.key))}}
function previousKey(key){let [y,m]=key.split("-").map(Number),x=new Date(y,m-2,d.startDay);return`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}`}
function calculateCarry(key){let c=d.cycles[key];if(!c||c.closed)return{};let out={};d.categories.forEach(([name,budget])=>{let used=d.expenses.filter(e=>e.type==="budget"&&keyForDate(e.date)===key&&e.cat===name).reduce((a,e)=>a+e.amount,0);let rem=Math.max(0,baseBudgetFor(name,key)-used);if(rem)out[name]=rem});return out}
function baseBudgetFor(name,key=viewKey){
 let exact=d.budgetOverrides[key]?.[name];
 if(exact!==undefined)return exact;
 let candidates=Object.keys(d.budgetOverrides||{}).filter(k=>k<=key&&d.budgetOverrides[k]?.[name]!==undefined).sort();
 if(candidates.length)return d.budgetOverrides[candidates[candidates.length-1]][name];
 let cat=d.categories.find(x=>x[0]===name); return cat?cat[1]:0;
}
function cycleBudgetTotal(key=viewKey){let c=d.cycles[key]||{carried:{}};return d.categories.reduce((a,x)=>a+baseBudgetFor(x[0],key)+(c.carried[x[0]]||0),0)}
function incomeTotal(key=viewKey){let arr=incomes(key);return arr.reduce((a,e)=>a+e.amount,0)}
function expenseTotal(key=viewKey){return expenses(key).reduce((a,e)=>a+e.amount,0)}
function budgetSpent(name,key=viewKey){return d.expenses.filter(e=>e.type==="budget"&&keyForDate(e.date)===key&&e.cat===name).reduce((a,e)=>a+e.amount,0)}
function savingSpent(name,key=viewKey){return d.expenses.filter(e=>e.type==="saving"&&keyForDate(e.date)===key&&e.cat===name).reduce((a,e)=>a+e.amount,0)}
function savingAmountFor(name,key=viewKey){
 let exact=d.savingOverrides?.[key]?.[name];
 if(exact!==undefined)return Number(exact);
 let cat=d.savings.find(x=>x[0]===name);
 return cat?Number(cat[1]):0;
}
function savingMonthlyTotal(key=viewKey){return d.savings.reduce((a,x)=>a+savingAmountFor(x[0],key),0)}
function cycleKeyOffset(key,delta){
 let [y,m]=key.split("-").map(Number),dt=new Date(y,m-1+delta,1);
 return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}`;
}
function savingStartKey(name){
 let cat=d.savings.find(x=>x[0]===name);
 return (cat&&cat[3])||Object.keys(d.cycles||{}).sort()[0]||current().key;
}
function savingAccumulated(name,key=viewKey){
 let start=savingStartKey(name);
 if(start>key)return 0;
 let total=0,k=start,guard=0;
 while(k<=key&&guard++<600){total+=savingAmountFor(name,k);k=cycleKeyOffset(k,1);}
 let spent=d.expenses.filter(e=>e.type==="saving"&&e.cat===name&&keyForDate(e.date)<=key).reduce((a,e)=>a+e.amount,0);
 return total-spent;
}
function savingAccumulatedTotal(key=viewKey){return d.savings.reduce((a,x)=>a+savingAccumulated(x[0],key),0)}
function totalSavedFromIncome(key){let inc=incomeTotal(key),out=expenseTotal(key);return Math.max(0,inc-out)}
function renderHome(){ensureCurrentCycle();let c=viewCycle(),inc=incomeTotal(),bt=cycleBudgetTotal(),st=savingMonthlyTotal(),bu=expenses(viewKey).filter(e=>e.type==="budget").reduce((a,e)=>a+e.amount,0),remain=bt-bu,allocated=bt+st;document.getElementById("period").innerHTML=`<button class="secondary" onclick="moveMonth(-1)">‹</button>　${c.label}　<button class="secondary" onclick="moveMonth(1)">›</button>`;
document.getElementById("home").innerHTML=`<div class="card hero"><div class="label">今月の収入</div><div class="big">${yen(inc)}</div><div class="row mini"><span>予算＋積立 ${yen(allocated)}</span><span>未振分 ${yen(inc-allocated)}</span></div><div class="progress"><i style="width:${Math.min(100,inc?allocated/inc*100:0)}%"></i></div></div>
<div class="card"><div class="row"><span class="mini muted">表示中：${c.label}</span><button class="secondary" onclick="goCurrent()">今月へ</button></div></div><div class="grid"><div class="card"><div class="label">予算合計</div><div class="amount">${yen(bt)}</div><div class="muted mini">残り ${yen(remain)}</div></div><div class="card"><div class="label">現在の積立残高</div><div class="amount">${yen(savingAccumulatedTotal(viewKey))}</div><div class="muted mini">今月の積立予定 ${yen(st)}</div></div></div>
<div class="card"><div class="row"><h2>予算の残り</h2><span class="pill">繰越 ${yen(Object.values(d.cycles[c.key].carried).reduce((a,x)=>a+x,0))}</span></div>${d.categories.map(x=>{let total=baseBudgetFor(x[0],viewKey)+(d.cycles[c.key].carried[x[0]]||0),u=budgetSpent(x[0]);return`<div class="cat"><div class="row"><span>${x[0]}</span><b>${yen(total-u)}</b></div><div class="muted mini">予算 ${yen(total)} / 使用 ${yen(u)}</div></div>`}).join("")}</div>
<div class="card"><h2>🏦 積立</h2>${d.savings.map(x=>{let m=savingAmountFor(x[0],viewKey);return`<div class="cat"><div class="row"><span>${x[0]}</span><b>${yen(savingAccumulated(x[0],viewKey))}</b></div><div class="muted mini">毎月 ${yen(m)} / 今月使用 ${yen(savingSpent(x[0]))}</div></div>`}).join("")}</div>
<div class="card"><div class="row"><div><div class="label">現在の貯金</div><div class="amount">${yen(d.bank)}</div></div><div><div class="label">今月の支出</div><div class="amount">${yen(expenseTotal())}</div></div></div></div>
<div class="card"><h2>収入</h2>${incomes().length?incomes().map(e=>`<div class="cat row"><span>${e.memo||"収入"}<small class="muted"> ${e.date}</small></span><b>${yen(e.amount)}</b></div>`).join(""):`<div class="muted mini">収入を登録するとここに表示されます。</div>`}<button class="primary" onclick="openIncome()">＋ 収入を追加</button></div>`}
function renderBudget(){let c=viewCycle();document.getElementById("budget").innerHTML=`<div class="card"><h2>💰 予算</h2><div class="notice">毎月10日に新しい家計期間を自動作成。前月の未使用予算は自動で繰り越します。</div>${d.categories.map((x,i)=>`<div class="cat"><div class="row"><span>${x[0]}</span><b>${yen(baseBudgetFor(x[0],viewKey)+(d.cycles[c.key].carried[x[0]]||0)-budgetSpent(x[0]))}</b></div><div class="row mini muted"><span>基本 ${yen(baseBudgetFor(x[0],viewKey))} / 繰越 ${yen(d.cycles[c.key].carried[x[0]]||0)}</span><button class="secondary" onclick="editBudget(${i})">変更</button></div></div>`).join("")}</div><div class="card"><h2>締め処理</h2><div class="notice">現在の期間を締めると未使用分を次の10日から自動で繰り越します。通常は何もしなくても10日に新しい期間が作られます。</div><button class="primary" onclick="closeCurrent()">この月を締める</button></div>`}
function renderSaving(){document.getElementById("saving").innerHTML=`<div class="card"><h2>🏦 目的別積立</h2>${d.savings.map((x,i)=>{let m=savingAmountFor(x[0],viewKey);return`<div class="cat"><div class="row"><span>${x[0]}</span><b>${yen(savingAccumulated(x[0],viewKey))}</b></div><div class="mini muted">今月積立 ${yen(m)} / 今月支出 ${yen(savingSpent(x[0]))} / 上の金額は繰越後の残高</div><div style="display:flex;gap:8px;margin-top:8px"><button class="secondary" onclick="editSaving(${i})">変更</button><button class="danger" onclick="deleteSaving(${i})">削除</button></div></div>`}).join("")}<button class="primary" onclick="addSaving()">＋ 積立を追加</button></div><div class="card"><h2>💵 貯金</h2><div class="label">現在の貯金</div><div class="big">${yen(d.bank)}</div><div class="muted mini">今月の収入−支出の参考額：${yen(totalSavedFromIncome())}</div><button class="secondary" onclick="editBank()">貯金額を変更</button></div>`}
function months12(){let now=current().start,a=[];for(let i=11;i>=0;i--){let x=new Date(now.getFullYear(),now.getMonth()-i,d.startDay);a.push({key:`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}`,label:`${x.getMonth()+1}月`})}return a}
function renderAnnual(){let ms=months12(),rows=ms.map(m=>{let inc=incomeTotal(m.key),ex=expenseTotal(m.key),sv=Math.max(0,inc-ex);return{...m,inc,ex,sv}}),mxE=Math.max(1,...rows.map(x=>x.ex)),mxS=Math.max(1,...rows.map(x=>x.sv));document.getElementById("annual").innerHTML=`<div class="card"><h2>📊 1年間</h2><div class="label">家計期間ごとの収入・支出・貯金</div></div><div class="card"><h2>支出</h2><div class="chart">${rows.map(x=>`<div class="barwrap"><div class="value">${yen(x.ex)}</div><div class="bar" style="height:${Math.max(2,x.ex/mxE*135)}px"></div><div class="barlabel">${x.label}</div></div>`).join("")}</div></div><div class="card"><h2>貯金額</h2><div class="chart">${rows.map(x=>`<div class="barwrap"><div class="value">${yen(x.sv)}</div><div class="bar save" style="height:${Math.max(2,x.sv/mxS*135)}px"></div><div class="barlabel">${x.label}</div></div>`).join("")}</div></div><div class="card"><h2>月別</h2>${rows.map(x=>`<div class="cat"><div class="row"><span>${x.label}</span><b>${yen(x.sv)}</b></div><div class="muted mini">収入 ${yen(x.inc)} / 支出 ${yen(x.ex)}</div></div>`).join("")}</div>`}
function renderHistory(){let arr=[...expenses(viewKey)].sort((a,b)=>b.date.localeCompare(a.date));document.getElementById("history").innerHTML=`<div class="card"><h2>🧾 ${viewCycle().label} の支出履歴</h2>${arr.length?arr.map((e,i)=>`<div class="cat"><div class="row"><span><b>${e.cat}</b><br><small class="muted">${e.date} ${e.memo||""}</small></span><span><b>${yen(e.amount)}</b><br><button class="secondary" onclick="editExpense('${e.id}')">修正</button> <button class="danger" onclick="deleteExpense('${e.id}')">削除</button></span></div></div>`).join(""):`<div class="muted">まだ支出がありません。</div>`}</div>`}
function renderSettings(){document.getElementById("settings").innerHTML=`<div class="card"><h2>⚙️ 基本設定</h2><div class="pill" style="display:inline-block;margin-bottom:10px">予算表示同期版 v12</div><label class="mini">毎月の基本収入（記録がない期間の参考値）</label><input id="baseIncome" type="number" value="${d.baseIncome}"><label class="mini">家計開始日</label><input id="startDay" type="number" min="1" max="28" value="${d.startDay}"><button class="primary" onclick="saveSettings()">保存</button></div><div class="card"><h2>🗂️ カテゴリ</h2>${d.categories.map((x,i)=>`<div class="cat row"><span>${x[0]}</span><div style="display:flex;gap:8px"><button class="secondary" onclick="editBudget(${i})">変更</button><button class="danger" onclick="deleteCategory(${i})">削除</button></div></div>`).join("")}<button class="primary" onclick="addCategory()">＋ カテゴリを追加</button></div><div class="card"><h2>💾 データ</h2><p class="mini muted">バックアップはJSONファイルとして保存します。復元すると現在のデータが置き換わります。</p><button class="primary" onclick="backup()">バックアップを書き出す</button><br><br><button class="secondary" onclick="restoreFile()">バックアップを復元</button><input id="restoreInput" type="file" accept=".json" style="display:none"></div><div class="card"><h2>🧾 支出履歴</h2><button class="primary" onclick="tab('history',document.querySelectorAll('nav button')[0])">今月の履歴を見る</button></div>`}
function render(){ensureCurrentCycle();renderHome();renderBudget();renderSaving();renderAnnual();renderHistory();renderSettings()}
function moveMonth(delta){let [y,m]=viewKey.split("-").map(Number);let x=new Date(y,m-1+delta,d.startDay);viewKey=`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}`;if(!d.cycles[viewKey])d.cycles[viewKey]={createdAt:new Date().toISOString(),carried:{},closed:false};render();toast(`${viewCycle().label}を表示`)}
function goCurrent(){viewKey=current().key;render()}
function tab(id,btn){document.querySelectorAll("main").forEach(x=>x.classList.add("hidden"));document.getElementById(id).classList.remove("hidden");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));if(btn)btn.classList.add("active");document.querySelector(".fab").style.display=["home","history"].includes(id)?"block":"none";if(id==="history")renderHistory()}
function openModal(title,body){modal.innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="row"><h2>${title}</h2><button class="secondary" onclick="closeModal()">閉じる</button></div>${body}</div></div>`}
function closeModal(){modal.innerHTML=""}
function openIncome(editId=null){let e=editId?d.incomes.find(x=>x.id===editId):null;openModal(e?"収入を修正":"収入を追加",`<label class="mini">金額</label><input id="mi_amount" type="number" value="${e?.amount||""}"><label class="mini">日付</label><input id="mi_date" type="date" value="${e?.date||dateISO(new Date())}"><label class="mini">メモ</label><input id="mi_memo" value="${e?.memo||"給料"}"><button class="primary" onclick="${e?`updateIncome('${e.id}')`:"saveIncome()"}">保存</button>`)}
function saveIncome(){let a=+mi_amount.value;if(!a)return;d.incomes.push({id:crypto.randomUUID(),amount:a,date:mi_date.value,memo:mi_memo.value});save();closeModal();render();toast("収入を登録しました")}
function updateIncome(id){let e=d.incomes.find(x=>x.id===id);e.amount=+mi_amount.value;e.date=mi_date.value;e.memo=mi_memo.value;save();closeModal();render()}
function openExpense(editId=null){let e=editId?d.expenses.find(x=>x.id===editId):null;openModal(e?"支出を修正":"支出を追加",`<label class="mini">金額</label><input id="me_amount" type="number" value="${e?.amount||""}"><label class="mini">区分</label><select id="me_type"><option value="budget" ${e?.type==="budget"?"selected":""}>通常予算から</option><option value="saving" ${e?.type==="saving"?"selected":""}>積立から</option></select><label class="mini">カテゴリ</label><select id="me_cat"></select><label class="mini">日付</label><input id="me_date" type="date" value="${e?.date||dateISO(new Date())}"><label class="mini">メモ</label><input id="me_memo" value="${e?.memo||""}"><button class="primary" onclick="${e?`updateExpense('${e.id}')`:"saveExpense()"}">保存</button>`);fillCats(e?.cat);me_type.onchange=()=>fillCats(); }
function fillCats(selected){me_cat.innerHTML=(me_type.value==="budget"?d.categories.map(x=>`<option ${x[0]===selected?"selected":""}>${x[0]}</option>`):d.savings.map(x=>`<option ${x[0]===selected?"selected":""}>${x[0]}</option>`)).join("")}
function saveExpense(){let a=+me_amount.value;if(!a)return;d.expenses.push({id:crypto.randomUUID(),amount:a,type:me_type.value,cat:me_cat.value,date:me_date.value,memo:me_memo.value});save();closeModal();render();toast("支出を登録しました")}
function updateExpense(id){let e=d.expenses.find(x=>x.id===id);e.amount=+me_amount.value;e.type=me_type.value;e.cat=me_cat.value;e.date=me_date.value;e.memo=me_memo.value;save();closeModal();render();toast("支出を修正しました")}
function editExpense(id){openExpense(id)}
function deleteExpense(id){if(confirm("この支出を削除しますか？")){d.expenses=d.expenses.filter(x=>x.id!==id);save();render();toast("削除しました")}}
function editBudget(i){
 let name=d.categories[i][0],currentBudget=baseBudgetFor(name,viewKey);
 openModal(`${name}の予算を変更`,`
 <div class="notice">表示中の「${viewCycle().label}」の予算を変更します。</div>
 <label class="mini">予算額</label><input id="eb_amount" type="number" value="${currentBudget}">
 <button class="primary" onclick="applyBudgetChange(${i},'only')">この月だけ反映</button>
 <br><br><button class="secondary" style="width:100%" onclick="applyBudgetChange(${i},'forward')">この月以降に反映</button>`);
}
function applyBudgetChange(i,mode){
 let name=d.categories[i][0],amount=+eb_amount.value;if(isNaN(amount)||amount<0)return;
 d.budgetOverrides=d.budgetOverrides||{};
 if(mode==="only"){
   d.budgetOverrides[viewKey]=d.budgetOverrides[viewKey]||{};
   d.budgetOverrides[viewKey][name]=amount;
 }else{
   d.budgetOverrides[viewKey]=d.budgetOverrides[viewKey]||{};
   d.budgetOverrides[viewKey][name]=amount;
   Object.keys(d.budgetOverrides).filter(k=>k>viewKey).forEach(k=>{if(d.budgetOverrides[k]&&name in d.budgetOverrides[k])delete d.budgetOverrides[k][name]});
 }
 save();closeModal();render();toast(mode==="only"?"この月だけ変更しました":"この月以降の予算を変更しました");
}
function editSaving(i){
 let name=d.savings[i][0],current=savingAmountFor(name,viewKey);
 openModal(`${name}の積立額を変更`,`
 <div class="notice">表示中の「${viewCycle().label}」だけ変更します。過去・未来の月は変わりません。</div>
 <label class="mini">毎月の積立額</label>
 <input id="es_amount" type="number" min="0" value="${current}">
 <button class="primary" onclick="applySavingChange(${i})">この月だけ反映</button>`);
}
function applySavingChange(i){
 let name=d.savings[i][0],amount=Number(document.getElementById("es_amount").value);
 if(!Number.isFinite(amount)||amount<0){alert("0円以上の金額を入力してね");return;}
 d.savingOverrides=d.savingOverrides||{};
 d.savingOverrides[viewKey]=d.savingOverrides[viewKey]||{};
 d.savingOverrides[viewKey][name]=amount;
 save();closeModal();render();toast(`${name}：${yen(amount)} に変更しました`);
}
function deleteCategory(i){
 let name=d.categories[i][0];
 if(!confirm(`「${name}」をカテゴリ一覧から削除しますか？\n過去の支出履歴は残ります。`))return;
 d.categories.splice(i,1);
 Object.values(d.cycles||{}).forEach(c=>{if(c.carried)delete c.carried[name]});
 save();render();toast("カテゴリを削除しました");
}
function deleteSaving(i){
 let name=d.savings[i][0];
 if(!confirm(`「${name}」を積立一覧から削除しますか？\n過去の支出履歴は残ります。`))return;
 d.savings.splice(i,1);
 save();render();toast("積立を削除しました");
}
function addCategory(){let n=prompt("カテゴリ名");if(n){d.categories.push([n,0]);save();render()}}
function addSaving(){let n=prompt("積立名");if(!n)return;let a=+prompt("毎月の積立額","0")||0;d.savings.push([n,a,0,viewKey]);save();render()}
function editBank(){let n=prompt("現在の貯金額",d.bank);if(n!==null&&!isNaN(+n)){d.bank=+n;save();render()}}
function saveSettings(){d.baseIncome=+baseIncome.value||0;let old=d.startDay;d.startDay=Math.min(28,Math.max(1,+startDay.value||10));if(old!==d.startDay)ensureCurrentCycle();save();render();toast("保存しました")}
function closeCurrent(){let c=current();if(d.cycles[c.key].closed)return;d.cycles[c.key].carried=calculateCarry(c.key);d.cycles[c.key].closed=true;save();ensureCurrentCycle();render();toast("この月を締めました")}
function backup(){let blob=new Blob([JSON.stringify(d,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`わたしの家計簿_${current().key}.json`;a.click();URL.revokeObjectURL(url);toast("バックアップを保存しました")}
function restoreFile(){restoreInput.click();restoreInput.onchange=()=>{let f=restoreInput.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.categories||!x.expenses||!x.cycles)throw 0;if(confirm("現在のデータをバックアップで置き換えますか？")){d=x;save();render();toast("復元しました")}}catch{alert("このバックアップは読み込めませんでした")}};r.readAsText(f)}}
function toast(t){toastEl=t;toastEl.textContent=t;toastEl.className="toast";setTimeout(()=>toastEl.className="",1800)}
window.toastEl=document.getElementById("toast");
render();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script></body></html>
